# Bouwt de iOS-app in de cloud (GitHub Mac) en zet hem op TestFlight.
# Starten: GitHub → Actions → "iOS → TestFlight" → Run workflow.
# Nodig als repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID      – je Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID         – Key ID van de App Store Connect API-sleutel
#   ASC_ISSUER_ID      – Issuer ID (staat boven de lijst met sleutels)
#   ASC_KEY_P8         – volledige inhoud van het gedownloade AuthKey_XXXX.p8-bestand
name: iOS → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Nieuwste Xcode kiezen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Xcode: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Web-app bouwen en in het iOS-project zetten
        run: |
          npm ci
          npm run build:web
          npx cap sync ios

      - name: API-sleutel klaarzetten
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: API-sleutel controleren (zonder waarden te tonen)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Key ID: ${#KEY_ID} tekens, vorm ok: $([[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] && echo ja || echo NEE)"
          echo "Issuer ID: vorm ok (UUID): $([[ "$ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] && echo ja || echo NEE)"
          echo "Team ID: vorm ok: $([[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] && echo ja || echo NEE)"
          echo "Sleutelbestand: $(head -1 "$RUNNER_TEMP/keys/AuthKey.p8" | grep -q 'BEGIN PRIVATE KEY' && echo 'begint goed' || echo 'NIET het juiste formaat')"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography >/dev/null 2>&1 || python3 -m pip install --quiet pyjwt cryptography >/dev/null
          python3 - <<'PY'
          import os, time, jwt, urllib.request, urllib.error
          key = open(os.path.join(os.environ['RUNNER_TEMP'], 'keys', 'AuthKey.p8')).read()
          now = int(time.time())
          token = jwt.encode({'iss': os.environ['ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'},
                             key, algorithm='ES256', headers={'kid': os.environ['KEY_ID'], 'typ': 'JWT'})
          req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?limit=1', headers={'Authorization': 'Bearer ' + token})
          try:
              with urllib.request.urlopen(req) as r:
                  print('App Store Connect API: OK (', r.status, ') — sleutel, Key ID en Issuer ID passen bij elkaar')
          except urllib.error.HTTPError as e:
              print('App Store Connect API: FOUT', e.code, '— 401 = Key ID, Issuer ID en sleutelbestand passen niet bij elkaar; 403 = rol van de sleutel te laag')
              raise SystemExit(1)
          PY

      - name: Tijdelijke App Store-ondertekening klaarzetten
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: io.github.chenxi981211.ritlog
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8"
          python3 ios/App/ci/signing.py setup

      - name: Archief bouwen (App Store-ondertekening)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ritlog.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Controle — rechten in de gebouwde app
        run: |
          APP="$RUNNER_TEMP/Ritlog.xcarchive/Products/Applications/App.app"
          echo "== Rechten (entitlements) in de app =="
          codesign -d --entitlements :- "$APP" 2>/dev/null | plutil -p - || true
          echo "== Rechten in het profiel =="
          security cms -D -i "$APP/embedded.mobileprovision" | plutil -extract Entitlements xml1 -o - - | plutil -p - || true

      - name: Uploaden naar App Store Connect / TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/App/ci/ExportOptions.plist "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$OPTS"
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string Apple Distribution" "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$OPTS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:io.github.chenxi981211.ritlog string $PROFILE_NAME" "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ritlog.xcarchive" \
            -exportOptionsPlist "$OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Tijdelijk certificaat en profiel intrekken
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/keys/AuthKey.p8" ]; then
            export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8"
            python3 ios/App/ci/signing.py cleanup || true
          fi

      - name: Sleutel opruimen
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
